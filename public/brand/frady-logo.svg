<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="frady">
  <!--
    PLACEHOLDER BRAND MARK — white cursive "frady" on a transparent field.
    Mirrors the white logo provided. Looks crisp on the dark site.

    >>> To use your real white logo:
        1. Drop your file in /public/brand/frady-logo.png
        2. Open src/components/public/LogoMark.tsx and set LOGO_SRC to
           '/brand/frady-logo.png'
    Everything (navbar, footer, login, dashboard sidebar, hero animation,
    contact CTA) reads from that single constant.
  -->
  <text
    x="256"
    y="312"
    text-anchor="middle"
    font-family="'Snell Roundhand','Brush Script MT','Segoe Script',cursive"
    font-size="210"
    font-style="italic"
    fill="#ffffff"
  >frady</text>
</svg>
